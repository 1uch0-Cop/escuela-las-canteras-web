name: Site security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate site security and local links
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import re, sys

          root = Path('.')
          errors = []

          forbidden_names = {'.env', '.env.local', '.env.production'}
          forbidden_suffixes = {'.pem', '.key', '.p12', '.pfx', '.sqlite', '.db'}

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes:
                  errors.append(f'Archivo sensible no permitido: {path}')

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.inline_scripts = 0
                  self.external_scripts = []
                  self.external_styles = []
                  self.csp = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value)

                  if tag == 'script':
                      src = attrs.get('src')
                      if not src:
                          self.inline_scripts += 1
                      elif urlparse(src).scheme or src.startswith('//'):
                          self.external_scripts.append(src)

                  if tag == 'link' and 'stylesheet' in (attrs.get('rel') or '').lower():
                      href = attrs.get('href')
                      if href and (urlparse(href).scheme or href.startswith('//')):
                          self.external_styles.append(href)

                  if tag == 'meta' and (attrs.get('http-equiv') or '').lower() == 'content-security-policy':
                      self.csp = attrs.get('content')

          ignored_pages = {'noticia-plantilla.html'}
          primary_pages = {'index.html', 'contacto.html', 'escuela.html', 'sello.html', '404.html'}
          required_csp_parts = [
              "default-src 'self'",
              "script-src 'self'",
              "object-src 'none'",
              "base-uri 'none'",
              "frame-src 'none'",
          ]

          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8', errors='ignore')
              lower = text.lower()
              parser = PageParser()
              parser.feed(text)

              if html.name in ignored_pages:
                  continue

              if 'fonts.googleapis.com' in lower or 'fonts.gstatic.com' in lower:
                  errors.append(f'Dependencia de Google Fonts no permitida en {html}')

              if 'http-equiv="x-content-type-options"' in lower:
                  errors.append(f'Meta X-Content-Type-Options inválida en {html}; debe configurarse como header HTTP')

              if parser.inline_scripts:
                  errors.append(f'Script inline no permitido en {html}: {parser.inline_scripts}')
              for src in parser.external_scripts:
                  errors.append(f'Script externo no permitido en {html}: {src}')
              for href in parser.external_styles:
                  errors.append(f'Hoja de estilo externa no permitida en {html}: {href}')

              if html.name in primary_pages:
                  if 'assets/logos/logo-escuela.png' not in text:
                      errors.append(f'Favicon institucional faltante en {html}')
                  if not parser.csp:
                      errors.append(f'CSP faltante en {html}')
                  else:
                      for part in required_csp_parts:
                          if part not in parser.csp:
                              errors.append(f'CSP incompleta en {html}: falta {part}')

              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or ref.startswith(('#', 'mailto:', 'tel:', '//')):
                      continue
                  local = unquote(parsed.path)
                  if not local or local == 'assets/icono/insignia.ico':
                      continue
                  target = (html.parent / local).resolve()
                  if not target.exists():
                      errors.append(f'Enlace local roto en {html}: {ref}')

          token_patterns = [
              re.compile(r'ghp_[A-Za-z0-9]{20,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{20,}'),
              re.compile(r'sk-[A-Za-z0-9_-]{20,}'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          ]
          text_suffixes = {'.html', '.js', '.css', '.md', '.txt', '.yml', '.yaml', '.json'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for pattern in token_patterns:
                  if pattern.search(text):
                      errors.append(f'Posible secreto detectado en {path}: {pattern.pattern}')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              sys.exit(1)

          print('OK: controles de seguridad, dependencias y enlaces locales superados.')
